<div class="additional">
    <div class="popular-tags">
        <h2>Popular Tags</h2>
        <div class="tags">
            {% for tag in popular_tags %}
                <p><a href="{% url 'tag' tag %}">{{ tag }}</a></p>
            {% endfor %}
        </div>
    </div>
    <div class="best-members">
        <h2>Best Members</h2>
        <div class="best-mambers-block">
            {% for member in best_members %}
                <p><a href="{% url 'index' %}" class="a-2">{{ member }}</a></p>
            {% endfor %}
        </div>
    </div>
</div>
