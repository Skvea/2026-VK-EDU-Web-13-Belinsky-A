{% load static %}
<header>
    <div class="main-label">
        <a href="{% url 'index' %}" id="h1-1"><h1>BezBazara</h1></a>
        <p>Short and to the point</p>
    </div>
    <div class="header-search">
        <form class="header-search-form" role="search" action="{% url 'index' %}" method="get">
            <input type="search" name="q" placeholder="Input text here" aria-label="Search" maxlength="100">
            <button type="submit">Search</button>
        </form>
        {% if is_authorized and request.resolver_match.url_name != 'ask' %}
            <a class="ask-btn" href="{% url 'ask' %}">Ask</a>
        {% endif %}
    </div>

    {% if is_authorized %}
        <div class="header-user-info">
            <img class="avatar" src="{% static 'core/img/avatar-default.png' %}" alt="Avatar">
            <div class="header-user-actions">
                <span id="span-1">Dr. Pepper</span>
                <div>
                    <a href="{% url 'profile' %}">Settings</a>
                    <a href="{% url 'login' %}">Logout</a>
                </div>
            </div>
        </div>
    {% else %}
        <div class="header-user-info">
            <div class="header-user-actions">
                <a href="{% url 'login' %}">Log in</a>
                <a href="{% url 'signup' %}">Register</a>
            </div>
        </div>
    {% endif %}
</header>
