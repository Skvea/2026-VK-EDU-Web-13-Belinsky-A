<!DOCTYPE html>

        <link rel="icon" type="image/png" sizes="32x32" href="static/img/favicon-32.png">
        <link rel="stylesheet" href="static/css/style.css">
    </head>
    <body>
        <header>
            <div class="main-label">
                <a href="index.html" id="h1-1"><h1>BezBazara</h1></a>
                <p>Short and to the point</p>
            </div>
            <div class="header-search">
                <form class="header-search-form" role="search" action="index.html" method="get">
                    <input type="search" name="q" placeholder="Input text here" aria-label="Search" maxlength="100">
                    <button type="submit">Search</button>
                </form>
            </div>

            <div class="header-user-info">
                <div class="header-user-actions">
                    <a href="login.html">Log in</a>
                    <a href="signup.html">Register</a>
                </div>
            </div>
        </header>
        <main>
            <div class="form-page">
                <h2>Log In</h2>
                <form class="form" action="#" method="post">
                    <div class="form-alert" role="alert">Sorry, wrong login or password!</div>

                    <label for="login">Login</label>
                    <div class="form-field">
                        <input type="text" id="login" name="login" class="form-control" maxlength="30" placeholder="Enter your login here" autocomplete="username" required>
                    </div>

                    <label for="password">Password</label>
                    <div class="form-field">
                        <input type="password" id="password" name="password" class="form-control" maxlength="128" value="12345678" autocomplete="current-password" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit">Log in!</button>
                    </div>

                    <p class="form-link form-actions"><a href="signup.html">create new account</a></p>
                </form>
            </div>
            <div class="additional">
                <div class="popular-tags">
                    <h2>Popular Tags</h2>
                    <div class="tags">
                        <p><a href="tag.html">perl</a></p>

                    </div>

            </div>
        </main>
        <footer>
