{% load static %}
<article class="question answer">
    <div class="question-avatar-and-likes">
        <img class="avatar" src="{% static 'core/img/avatar-default.png' %}" alt="">
        <div class="likes-common">
            <div class="updown-buttons">
                <button type="button" class="updown-button" aria-label="Нравится" aria-pressed="false">▲</button>
                <button type="button" class="updown-button" aria-label="Не нравится" aria-pressed="false">▼</button>
            </div>
            <span class="likes-count">{{ answer.likes }}</span>
        </div>
    </div>
    <div class="question-text">
        <p>{{ answer.text }}</p>
        <p class="meta">Answered <time datetime="{{ answer.created }}">{{ answer.created }}</time></p>
        <label class="correct"><input type="checkbox"{% if answer.is_correct %} checked{% endif %}> Correct!</label>
    </div>
</article>
