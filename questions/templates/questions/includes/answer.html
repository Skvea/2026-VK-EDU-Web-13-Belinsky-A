{% load static %}
<article class="question answer">
    <div class="question-avatar-and-likes">
        <img class="avatar" src="{{ answer.author.profile.get_avatar_url }}" alt="{{ answer.author.username }}">
        <div class="likes-common">
            <div class="updown-buttons">
                <button type="button" class="updown-button" aria-label="Upvote" aria-pressed="false">▲</button>
                <button type="button" class="updown-button" aria-label="Downvote" aria-pressed="false">▼</button>
            </div>
            <span class="likes-count">{{ answer.rating }}</span>
        </div>
    </div>
    <div class="question-text">
        <p>{{ answer.text }}</p>
        <p class="meta">Answered <time datetime="{{ answer.created_at|date:'c' }}">{{ answer.created_at|date:'Y-m-d H:i' }}</time></p>
        <label class="correct"><input type="checkbox"{% if answer.is_correct %} checked{% endif %}> Correct!</label>
    </div>
</article>
