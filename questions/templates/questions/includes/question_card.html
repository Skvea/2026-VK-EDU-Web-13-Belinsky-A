{% load static %}
<div class="question">
    <div class="question-avatar-and-likes">
        <img class="avatar" src="{% static 'core/img/avatar-default.png' %}" alt="">
        <div class="likes-common">
            <div class="updown-buttons">
                <button type="button" class="updown-button" aria-label="Нравится" aria-pressed="false">▲</button>
                <button type="button" class="updown-button" aria-label="Не нравится" aria-pressed="false">▼</button>
            </div>
            <span class="likes-count">{{ question.likes }}</span>
        </div>
    </div>
    <div class="question-text">
        <a href="{% url 'question' question.id %}">
            <h3>{{ question.title }}</h3>
        </a>
        <p>{{ question.text }}</p>
        <div class="question-answers-tags">
            <p><a href="{% url 'question' question.id %}">answer ({{ question.answers_count }})</a></p>
            <p>Tags:
                {% for tag in question.tags %}
                    <a href="{% url 'tag' tag %}">{{ tag }}</a>
                {% endfor %}
            </p>
        </div>
    </div>
</div>
