{% load static %}
<div class="question">
    <div class="question-avatar-and-likes">
        <img class="avatar" src="{{ question.author.profile.get_avatar_url }}" alt="{{ question.author.username }}">
        <div class="likes-common">
            <div class="updown-buttons">
                <button type="button" class="updown-button" aria-label="Upvote" aria-pressed="false">▲</button>
                <button type="button" class="updown-button" aria-label="Downvote" aria-pressed="false">▼</button>
            </div>
            <span class="likes-count">{{ question.rating }}</span>
        </div>
    </div>
    <div class="question-text">
        <a href="{{ question.get_absolute_url }}">
            <h3>{{ question.title }}</h3>
        </a>
        <p>{{ question.text }}</p>
        <div class="question-answers-tags">
            <p><a href="{{ question.get_absolute_url }}">answer ({{ question.answers_count }})</a></p>
            <p>Tags:
                {% for tag in question.tags.all %}
                    <a href="{{ tag.get_absolute_url }}">{{ tag.name }}</a>
                {% empty %}
                    <span>no tags</span>
                {% endfor %}
            </p>
        </div>
    </div>
</div>
